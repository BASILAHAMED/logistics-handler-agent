[project]
name = "logistics-handler"
version = "1.0.0"
description = "Logistics Handler: a multi-agent, multi-model, self-healing logistics ops desk built on Google ADK + Gemini + MCP"
authors = [{ name = "GenOS Team" }]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "google-adk==2.12.0",
    "mcp>=2.3,<3",
    # Non-Gemini models (Claude/OpenAI/local) via LiteLLM. >=1.84 skips the compromised 1.82.7/1.82.8.
    "litellm>=1.84",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lh"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::UserWarning"]
